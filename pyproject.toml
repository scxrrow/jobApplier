[project]
name = "jobot"
version = "0.1.0"
description = "Pipeline de candidature : fetch d'offres, scoring, CV adapte"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "rich>=13.7",
    "google-genai>=1.0",
    "openai>=1.40",
    "jinja2>=3.1",
    "playwright>=1.45",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.2",
]

[project.scripts]
jobot = "jobot.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobot"]
